<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="icon/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>None Labs - Products</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/master.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/icon.css">
    <link rel="stylesheet" href="css/footer.css">


    <style>
        #banner {
            width: 427px;
            height: 28px;
        }

        #main {
            margin-top: 212px;
            margin-left: 350px;
        }

        #banner {
            width: 339px;
            height: auto;

            font-family: "Red Hat Display";
            font-weight: 400;
            font-size: 50px;
            line-height: 100%;
            letter-spacing: 0%;

            color: #343434;
        }

        #projects,
        .projects-item {
            font-family: "Red Hat Display";
            font-weight: 400;
            font-size: 36px;
            line-height: 100%;

            margin-top: 40px;

            display: flex;
            align-items: center;
        }

        .projects-item:first-of-type {
            margin-top: 50px;
        }

        #projects-icon,
        .projects-icon {
            margin-left: 14px;

            width: 30px;
            height: 30px;

            background: url(icon/arrow_forward.svg) no-repeat center;
            color: #686868;
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .projects-item:hover .projects-icon {
            transform: translateX(6px);
        }

        .projects-link {
            color: inherit;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .project-tagline {
            font-family: "Red Hat Display";
            font-size: 16px;
            color: #888888;
            margin-top: 6px;
            margin-left: 2px;
        }

        #project-more {
            font-family: "Red Hat Display";
            font-weight: 400;
            font-size: 28px;
            line-height: 100%;

            color: #686868;
            margin-top: 140px;
        }

        
        #small-screen {
            display: none;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
        }

        #small-screen-text {
            padding: 3rem;
            font-size: 2rem;
            border-radius: 1rem;
        }

        @media (max-width: 1400px) {
            #large-screen {display: none;}
            #small-screen {display: flex;}
        }

        @media (min-width: 1400px) {
            #large-screen {display: block;}
            #small-screen {display: none;}
        }
    </style>

</head>

<body>

    <div id="small-screen">
        <div id="small-screen-text banner">
            <h1 id="banner">It is not marked in that size.</h1>
        </div>
    </div>

    

    <div id="large-screen">

        <div id="menu-bar">
            <a id="logo-full" style="margin-right: 58px;" href="/"></a>
            <a id="menu" href="/products">Products</a>
        </div>

        <div id="main">
            <div id="mini-logo" style="margin-bottom: 10px;"></div>
            <div id="banner">Products</div>

            <div class="projects-item" id="projects">
                <a class="projects-link" href="/gittester.html">
                    <div id="projects-text">Git Tester</div>
                    <span class="projects-icon" id="projects-icon"></span>
                </a>
            </div>

            <div class="projects-item">
                <a class="projects-link" href="/ecocycling.html">
                    <div id="projects-text">EcoCycling</div>
                    <span class="projects-icon"></span>
                </a>
            </div>


            <div id="project-more">More to come ;)</div>
        </div>


        <div id="footer">
            <div id="logo-full"></div>

            <div class="footer-info">
                <div style="display: block;">Representative: Mireu Lim</div>
                <div style="display: block;">Business Registration Number: 693-17-01866</div>
                <div style="display: block;">Email: limmireu1214@gmail.com</div>
                <div style="display: block;">© 2026. None Labs. All rights reserved.</div>
            </div>
        </div>
    </div>

</body>

</html>
